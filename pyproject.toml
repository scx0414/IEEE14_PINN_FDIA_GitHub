[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ieee14-pinn-fdia"
version = "0.1.0"
description = "AC state estimation and residual-based FDIA detection research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "torch>=2.4,<3"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]

[project.scripts]
ieee14-fdia = "ieee14_fdia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ieee14_fdia._vendor" = ["XLSTM_LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
